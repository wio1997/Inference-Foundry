function renderTimeline(){const root=$('timeline-content'),base=DATA.baseline||{},items=rowsOf(base.request_timelines);const c=card('请求级时间线','选择一个实际场景与重复。warmup 与 formal 分开显示；横轴是客户端相对秒。First text 是客户端首个文本帧，不等同于模型 token-ready。');if(!items.length){c.append(el('div','empty','没有 request_timelines 数据。'));root.append(c);return}

function renderBudgetBoundaryAccounting(root){
